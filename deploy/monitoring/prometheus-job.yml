# Add this job to /root/job_hunter_bot/monitoring/prometheus.yml on the VPS.
# The Prometheus container must resolve app.buyshark.kz to the Docker host:
# extra_hosts: ["app.buyshark.kz:host-gateway"] in its Compose service.
- job_name: kaspi-saas
  scrape_interval: 30s
  scheme: https
  metrics_path: /metrics
  static_configs:
    - targets: ["app.buyshark.kz:443"]
