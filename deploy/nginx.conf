# ================================================================
# /etc/nginx/sites-available/kaspi-saas
# Установить:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kaspi-saas
#   sudo ln -sf /etc/nginx/sites-available/kaspi-saas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ================================================================
server {
    listen 80;
    server_name _;                 # Замените на ваш домен/IP

    # ── API → FastAPI (uvicorn на порту 5000) ────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket (Telemetry) ─────────────────────────────────────
    location /api/ws/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Frontend (React SPA из dist/) ───────────────────────────
    location / {
        root  /var/www/kaspi-saas;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
