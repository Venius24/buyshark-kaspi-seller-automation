# ================================================================
# /etc/nginx/sites-available/kaspi-saas
# Установить:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kaspi-saas
#   sudo ln -sf /etc/nginx/sites-available/kaspi-saas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL через Let's Encrypt (выполнить один раз, когда DNS для ВСЕХ
# доменов уже указывает на этот сервер):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d buyshark.kz -d www.buyshark.kz -d app.buyshark.kz
#   sudo certbot --nginx -d tech.buyshark.kz
#
# tech.buyshark.kz: DNS + SSL уже настроены на проде (certbot прогнан
# 2026-08-08). Не забыть перед первым деплоем медиа для этого сайта:
#   scp -r buyshark-landing-tech/public/media/. root@<vps>:/root/buyshark-landing-tech-media/
# (deploy.sh сам подхватывает эту папку в каждый новый релиз).
#
# Этот файл — точная копия того, что реально стоит в
# /etc/nginx/sites-available/kaspi-saas на проде (снята после того как
# certbot дописал сюда SSL-блоки для всех трёх доменов, 2026-08-08).
# Блоки/комментарии "managed by Certbot" трогать руками не нужно —
# certbot сам их обновляет при renew.
#
# Три независимых сайта на одном сервере:
#   buyshark.kz      — маркетинговый лендинг (buyshark-landing), статика
#   tech.buyshark.kz — старая кинематографичная версия лендинга
#                       (buyshark-landing-tech), статика
#   app.buyshark.kz  — кабинет (React SPA дашборда) + FastAPI backend
# ================================================================

# ── buyshark.kz — маркетинговый лендинг ───────────────────────────
server {
    if ($host = www.buyshark.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = buyshark.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name buyshark.kz www.buyshark.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name buyshark.kz www.buyshark.kz;
    ssl_certificate /etc/letsencrypt/live/buyshark.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/buyshark.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/buyshark-landing;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Кэширование статики (включая видео сцен лендинга)
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── tech.buyshark.kz — старая кинематографичная версия лендинга ────
server {
    server_name tech.buyshark.kz;
    root  /var/www/buyshark-landing-tech;
    index index.html;
    try_files $uri $uri/ /index.html;

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tech.buyshark.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tech.buyshark.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = tech.buyshark.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name tech.buyshark.kz;
    return 404; # managed by Certbot
}

# ── app.buyshark.kz — кабинет ──────────────────────────────────────
server {
    server_name app.buyshark.kz;

    # Дефолт nginx — 1m, чего не хватает даже на небольшой ZIP с
    # накладными (Склейка накладных) или фото для автолистинга.
    # Без этого nginx рубит запрос 413-й HTML-страницей ещё до FastAPI,
    # и фронт падает на "Unexpected token '<' ... is not valid JSON",
    # пытаясь распарсить её как JSON-ответ API.
    client_max_body_size 500m;

    # ── API → FastAPI (uvicorn на порту 5000) ─────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket (Telemetry) ──────────────────────────────────
    location /api/ws/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Frontend (React SPA из dist/) ─────────────────────────
    location / {
        root  /var/www/kaspi-saas;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Кэширование статики
        location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/buyshark.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/buyshark.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.buyshark.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.buyshark.kz;
    return 404; # managed by Certbot
}
