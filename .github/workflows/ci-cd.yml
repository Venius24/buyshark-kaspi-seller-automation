name: CI / CD — Kaspi SaaS (Fast Pre-built Deploy)

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Запуск тестов Pytest
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Pytest — Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Сборка React Frontend в облаке GitHub (Bun)
  # ─────────────────────────────────────────────────────────────
  build-frontend:
    name: 💻 Build React Frontend (Cloud Bun)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & Build Frontend
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2b: Сборка лендинга buyshark-landing (Bun) — независимо от
  # кабинета, не завязана на тесты бекенда (чисто статический сайт).
  # ─────────────────────────────────────────────────────────────
  build-landing:
    name: 🦈 Build Landing (Cloud Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & Build Landing
        run: |
          cd buyshark-landing
          bun install --frozen-lockfile
          bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: buyshark-landing/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2c: Сборка старой версии лендинга buyshark-landing-tech
  # (tech.buyshark.kz) — тот же принцип, что и JOB 2b.
  # ─────────────────────────────────────────────────────────────
  build-landing-tech:
    name: 🦈 Build Landing Tech (Cloud Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & Build Landing Tech
        run: |
          cd buyshark-landing-tech
          bun install --frozen-lockfile
          bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-tech-dist
          path: buyshark-landing-tech/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Деплой на VPS — вся логика (провижининг/rollback/health-check)
  # живёт в deploy.sh, CI лишь передаёт готовые dist'ы и вызывает его.
  # ─────────────────────────────────────────────────────────────
